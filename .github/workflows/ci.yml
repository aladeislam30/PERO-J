name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/explorer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run contract tests
        run: cargo test

      - name: Build, optimize, and check contract WASM sizes
        working-directory: ${{ github.workspace }}
        env:
          MAX_CONTRACT_WASM_BYTES: 65536
        run: |
          cargo build --workspace --target wasm32-unknown-unknown --release

          contracts=(
            soroban_explorer_contract
            soroban_ipredict_token_contract
            soroban_market_contract
            soroban_referral_registry_contract
          )

          for contract in "${contracts[@]}"; do
            wasm="target/wasm32-unknown-unknown/release/${contract}.wasm"
            optimized="${wasm%.wasm}.optimized.wasm"

            test -s "$wasm" || {
              echo "::error::Missing WASM build output: $wasm"
              exit 1
            }

            stellar contract optimize --wasm "$wasm"

            test -s "$optimized" || {
              echo "::error::Missing optimized WASM output: $optimized"
              exit 1
            }

            size=$(stat -c '%s' "$optimized")
            echo "$contract optimized WASM: ${size} bytes"
            if (( size >= MAX_CONTRACT_WASM_BYTES )); then
              echo "::error::$contract optimized WASM is ${size} bytes; must be below ${MAX_CONTRACT_WASM_BYTES} bytes"
              exit 1
            fi
          done

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: explorer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/explorer_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run DB migrations
        run: npm run migrate
      - name: Run tests
        run: npm test

  indexer:
    name: Indexer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: explorer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/explorer_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run DB migrations
        run: npm run migrate
      - name: Run tests
        run: npm test

  oracle:
    name: Oracle tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oracle/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test

  db:
    name: DB migration lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: db/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint migrations
        run: npm run lint:migrations
