global:
  resolve_timeout: 5m

route:
  receiver: default-slack
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-pagerduty
      continue: true
    - matchers:
        - severity="critical"
      receiver: critical-slack
      continue: true
    - matchers:
        - severity="critical"
      receiver: critical-discord
      continue: true
    - matchers:
        - severity="warning"
      receiver: default-slack

receivers:
  - name: default-slack
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: "#alerts"
        send_resolved: true

  - name: critical-slack
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: "#alerts-critical"
        send_resolved: true

  - name: critical-discord
    discord_configs:
      - webhook_url: ${DISCORD_WEBHOOK_URL}
        send_resolved: true

  - name: critical-pagerduty
    pagerduty_configs:
      - service_key: ${PAGERDUTY_SERVICE_KEY}
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - service
