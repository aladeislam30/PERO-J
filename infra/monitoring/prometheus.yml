global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: handsoff
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: backend
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - backend:3000
        labels:
          service: backend

  - job_name: indexer
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - indexer:3001
        labels:
          service: indexer

  - job_name: oracle-daemon
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - oracle-daemon:3002
        labels:
          service: oracle-daemon
