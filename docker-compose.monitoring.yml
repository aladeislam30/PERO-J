version: "3.8"

# Monitoring stack for synthetic probe monitoring (issue #1203).
# - blackbox-exporter: probes frontend /health (HTTP 200) and Soroban RPC latency
# - prometheus: scrapes blackbox probes every 30s and evaluates alert rules
# - alertmanager: routes alerts (frontend response time > 2.5s)

services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    ports:
      - "9115:9115"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - blackbox-exporter
      - alertmanager
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

  # Evaluates the stuck-market and council-inactivity alert rules
  # (MarketStuckInUnresolved, CouncilVoteStalled) and pages the operations team.
  alert-rules:
    image: prom/prometheus:v2.51.0
    container_name: peroj-alert-rules
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts:/etc/prometheus/alerts:ro
      - alert-rules-data:/prometheus
    environment:
      - ALERTMANAGER_URL=http://alertmanager:9093
      - OPERATIONS_PAGER_ROUTE=operations
    depends_on:
      - alertmanager

volumes:
  prometheus-data:
  alertmanager-data:
  alert-rules-data:
